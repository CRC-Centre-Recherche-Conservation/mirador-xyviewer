version: 2
updates:
  # npm dependencies — weekly bump PRs targeting dev (so they're reviewed
  # before being merged up to main).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Let fresh releases age before proposing them (security updates are not delayed).
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # typescript-eslint supports typescript <6.1; revisit with the ESLint migration.
      - dependency-name: typescript
        versions: ['>=6']
      # Match the lowest supported runtime (engines node >=22).
      - dependency-name: '@types/node'
        versions: ['>=23']
    groups:
      # Build/test tooling majors move together (vite 8 needs plugin-react 6, vitest 5, ...).
      tooling:
        patterns:
          - vite
          - '@vitejs/*'
          - vitest
          - '@vitest/*'
          - vite-plugin-dts
      # Bundle minor/patch bumps to reduce PR noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # --- lint group (ESLint migration): keep eslint and its companions in one PR.
      lint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - globals
      # --- end lint group

  # GitHub Actions versions — keep workflows on supported action versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    labels:
      - dependencies
      - ci
    groups:
      # Bundle minor/patch action bumps to reduce PR noise.
      actions:
        update-types:
          - minor
          - patch
